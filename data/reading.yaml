- title: Linux kernel documentation
  url: https://docs.kernel.org/
  description: Official kernel documentation
  topics:
    - linux-internals
    - real-time-linux

- title: Linux man-pages project
  url: https://man7.org/linux/man-pages/
  description: System calls and interfaces
  topics:
    - linux-internals
    - unix-tools

- title: FreeBSD Handbook
  url: https://docs.freebsd.org/en/books/handbook/
  description: A comprehensive BSD reference
  topics:
    - bsd-unix

- title: "EEVDF Scheduler — Linux Kernel Documentation"
  url: https://docs.kernel.org/scheduler/sched-eevdf.html
  description: "Linux scheduling is an evolving design, not a settled algorithm. EEVDF uses virtual deadlines to balance fairness and responsiveness, offering an interesting comparison with the older Completely Fair Scheduler."
  topics:
    - linux-internals

- title: "Page Tables — Linux Kernel Documentation"
  url: https://docs.kernel.org/mm/page_tables.html
  description: "An exploration of the machinery behind virtual memory, address translation, page tables and page faults, including the interaction between hardware and the kernel."
  topics:
    - linux-internals

- title: "Anatomy of a System Call, Part 1 — LWN.net"
  url: https://lwn.net/Articles/604287/
  description: "A journey from user space into the kernel, revealing the architecture-specific machinery behind a seemingly simple system call. Older, but valuable for understanding the underlying mechanisms."
  topics:
    - linux-internals

- title: "namespaces(7) — Linux man-pages"
  url: https://man7.org/linux/man-pages/man7/namespaces.7.html
  description: "Containers are built from kernel mechanisms rather than a separate operating-system layer. This reference explains how namespaces isolate resources and how processes create, enter and inspect them."
  topics:
    - linux-internals

- title: "Core API Documentation — Linux Kernel Documentation"
  url: https://docs.kernel.org/core-api/index.html
  description: "A gateway into the kernel's internal programming interfaces, data structures and concurrency mechanisms. A useful reference map for exploring how Linux is implemented."
  topics:
    - linux-internals

- title: "FreeBSD Architecture Handbook"
  url: https://docs.freebsd.org/en/books/arch-handbook/
  description: "A look inside a complete BSD operating system, covering kernel initialization, virtual memory, locking, device drivers and jails. Particularly useful for comparing FreeBSD's implementation choices with those of Linux."
  topics:
    - bsd-unix

- title: "OpenBSD Security"
  url: https://www.openbsd.org/security.html
  description: "OpenBSD's distinctive approach to operating-system engineering: proactive code auditing, secure defaults and systematic removal of vulnerabilities. An interesting study of how engineering priorities shape an entire operating system."
  topics:
    - bsd-unix

- title: "NetBSD — Portability and Supported Hardware"
  url: https://www.netbsd.org/about/portability.html
  description: "NetBSD treats portability as an architectural discipline, separating machine-independent code from hardware-specific implementations. A demonstration of how careful abstraction supports radically different computer architectures."
  topics:
    - bsd-unix

- title: "Creating a Programming Philosophy from Pipes and a Tool Box"
  url: https://www.nokia.com/bell-labs/unix-history/philosophy.html
  description: "Pipes transformed individual Unix utilities into components that could be combined interactively. An account of how a simple technical mechanism helped shape an enduring approach to software design."
  topics:
    - bsd-unix
    - unix-history
    - unix-tools

- title: "Comparing BSD and Linux"
  url: https://docs.freebsd.org/en/articles/explaining-bsd/
  description: "What distinguishes BSD from Linux beyond the kernel and licensing? A discussion of development organisation, source-tree integration and the BSD projects. Some comparisons also provide a useful historical perspective."
  topics:
    - bsd-unix
    - unix-history

- title: "The UNIX Time-Sharing System — A Retrospective"
  url: https://www.nokia.com/bell-labs/about/dennis-m-ritchie/retro.html
  description: "Dennis Ritchie looks back at Unix's strengths and weaknesses, including files, processes, the shell, reliability and security. Fascinating because it discusses design limitations from the perspective of someone who created the system."
  topics:
    - unix-history

- title: "The UNIX Time-Sharing System"
  url: https://www.nokia.com/bell-labs/about/dennis-m-ritchie/cacm.html
  description: "The foundational paper by Ritchie and Thompson describing Unix's filesystem, processes and command interface. Remarkable for how many of its central ideas remain recognisable in modern Unix-like systems."
  topics:
    - unix-history
    - bsd-unix

- title: "The Evolution of the Unix Time-Sharing System"
  url: https://pdos.lcs.mit.edu/6.828/2005/readings/ritchie79evolution.html
  description: "Ritchie's firsthand account of Unix's origins, from Multics to the development of filesystems, process control and pipes. Particularly interesting for the interplay between technical invention, available hardware and Bell Labs culture."
  topics:
    - unix-history

- title: "The Development of the C Language"
  url: https://www.nokia.com/bell-labs/about/dennis-m-ritchie/chist.html
  description: "C and Unix evolved together. Ritchie traces the progression from BCPL through B to C, explaining how early hardware constraints and the requirements of systems programming shaped the language."
  topics:
    - unix-history
    - unix-tools

- title: "History of UNIX — The Open Group"
  url: https://www.unix.org/unix_history.html
  description: "A broader historical perspective on Unix's journey from Bell Labs research to universities, commercial implementations and standardisation. Useful for understanding how Unix developed into a family of related operating systems."
  topics:
    - unix-history

- title: "The A–Z of Programming Languages: AWK"
  url: https://a-z.readthedocs.io/en/latest/awk.html
  description: "One of AWK's creators, Alfred Aho, explains how the need for small data-processing programs led to a remarkably expressive language. Particularly interesting is the progression from pattern matching to AWK's pattern-action programming model."
  topics:
    - unix-tools
    - unix-history

- title: "Getting Started with AWK — GNU Awk User's Guide"
  url: https://www.gnu.org/software/gawk/manual/html_node/Getting-Started.html
  description: "AWK is more than a text-filtering utility: it is a compact, data-driven programming language. Records, patterns and actions combine to solve problems that might otherwise require substantially more code."
  topics:
    - unix-tools

- title: "GNU sed — A Stream Editor"
  url: https://www.gnu.org/software/sed/manual/sed.html
  description: "Sed illustrates the Unix idea of transforming data as it flows through a pipeline. Beyond simple substitutions, its pattern space and hold space provide a surprisingly capable model for scripted text transformations."
  topics:
    - unix-tools

- title: "Pipelines — Bash Reference Manual"
  url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  description: "The pipe character looks simple, but its execution semantics deserve attention. This reference explains how commands are connected, when subshells are involved and how pipeline exit status works."
  topics:
    - unix-tools

- title: "Program Design in the UNIX Environment"
  url: https://lists.gnu.org/archive/html/nmh-workers/2013-04/pdfkOFYrARx70.pdf
  description: "Rob Pike and Brian Kernighan's influential 1984 paper argues that a program's usefulness depends not just on its individual capabilities, but on how well it combines with other programs. Its criticism of unnecessary complexity remains relevant."
  topics:
    - unix-tools
    - unix-history

- title: "VIM Adventures"
  url: https://vim-adventures.com/
  description: "An interactive game for learning Vim commands and navigation."
  topics:
    - unix-tools
