- title: "EEVDF Scheduler — Linux Kernel Documentation"
  url: https://docs.kernel.org/scheduler/sched-eevdf.html
  description: "Linux scheduling is an evolving design, not a settled algorithm. EEVDF uses virtual deadlines to balance fairness and responsiveness, offering an interesting comparison with the older Completely Fair Scheduler."
  topics:
    - linux-internals

- title: "Page Tables — Linux Kernel Documentation"
  url: https://docs.kernel.org/mm/page_tables.html
  description: "An exploration of the machinery behind virtual memory, address translation, page tables and page faults, including the interaction between hardware and the kernel."
  topics:
    - linux-internals

- title: "Anatomy of a System Call, Part 1 — LWN.net"
  url: https://lwn.net/Articles/604287/
  description: "A journey from user space into the kernel, revealing the architecture-specific machinery behind a seemingly simple system call. Older, but valuable for understanding the underlying mechanisms."
  topics:
    - linux-internals

- title: "namespaces(7) — Linux man-pages"
  url: https://man7.org/linux/man-pages/man7/namespaces.7.html
  description: "Containers are built from kernel mechanisms rather than a separate operating-system layer. This reference explains how namespaces isolate resources and how processes create, enter and inspect them."
  topics:
    - linux-internals

- title: "Core API Documentation — Linux Kernel Documentation"
  url: https://docs.kernel.org/core-api/index.html
  description: "A gateway into the kernel's internal programming interfaces, data structures and concurrency mechanisms. A useful reference map for exploring how Linux is implemented."
  topics:
    - linux-internals

- title: "FreeBSD Architecture Handbook"
  url: https://docs.freebsd.org/en/books/arch-handbook/
  description: "A look inside a complete BSD operating system, covering kernel initialization, virtual memory, locking, device drivers and jails. Particularly useful for comparing FreeBSD's implementation choices with those of Linux."
  topics:
    - bsd-unix

- title: "OpenBSD Security"
  url: https://www.openbsd.org/security.html
  description: "OpenBSD's distinctive approach to operating-system engineering: proactive code auditing, secure defaults and systematic removal of vulnerabilities. An interesting study of how engineering priorities shape an entire operating system."
  topics:
    - bsd-unix

- title: "NetBSD — Portability and Supported Hardware"
  url: https://www.netbsd.org/about/portability.html
  description: "NetBSD treats portability as an architectural discipline, separating machine-independent code from hardware-specific implementations. A demonstration of how careful abstraction supports radically different computer architectures."
  topics:
    - bsd-unix

- title: "Creating a Programming Philosophy from Pipes and a Tool Box"
  url: https://www.nokia.com/bell-labs/unix-history/philosophy.html
  description: "Pipes transformed individual Unix utilities into components that could be combined interactively. An account of how a simple technical mechanism helped shape an enduring approach to software design."
  topics:
    - bsd-unix
    - unix-history
    - unix-tools

- title: "Explaining BSD"
  url: https://docs.freebsd.org/en/articles/explaining-bsd/
  description: "What distinguishes BSD from Linux beyond the kernel and licensing? A discussion of development organisation, source-tree integration and the BSD projects. Some comparisons also provide a useful historical perspective."
  topics:
    - bsd-unix
    - unix-history
